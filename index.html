<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobos Flexs - Sistema de Gestión en la Nube</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --accent-blue: #3b82f6; --accent-hover: #2563eb;
            --success-green: #10b981; --danger-red: #ef4444; --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid var(--border-color); }
        .header h1 { font-size: 28px; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 2px; }
        .header p { color: var(--text-muted); font-size: 14px; }
        .container { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .chart-section { grid-column: 1 / -1; margin-top: 10px; }
        @media (max-width: 800px) { .container { grid-template-columns: 1fr; } .chart-section { grid-column: 1; } }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); border: 1px solid var(--border-color); }
        .card h2 { font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); font-weight: bold; }
        .input-group input { width: 100%; padding: 12px; background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); font-size: 15px; outline: none; transition: border-color 0.3s; }
        .input-group input:focus { border-color: var(--accent-blue); }
        button { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background-color 0.3s, transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--accent-blue); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-success { background-color: var(--success-green); color: white; margin-top: 15px; }
        .btn-success:hover { background-color: #059669; }
        #cotizacion-preview { display: none; margin-top: 20px; padding: 15px; background-color: rgba(59, 130, 246, 0.1); border: 1px dashed var(--accent-blue); border-radius: 8px; }
        .preview-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .preview-total { font-size: 18px; font-weight: bold; color: var(--success-green); border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 10px; }
        .table-container { overflow-x: auto; max-height: 250px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 12px; position: sticky; top: 0; background-color: var(--card-bg); }
        .text-right { text-align: right; }
        .text-success { color: var(--success-green); font-weight: bold; }
        .text-muted { color: var(--text-muted); font-size: 11px;}
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; background-color: var(--border-color); display: inline-block; margin-bottom: 3px; }
        .dashboard { display: flex; gap: 15px; margin-bottom: 20px; }
        .dash-card { flex: 1; background-color: rgba(16, 185, 129, 0.1); border: 1px solid var(--success-green); padding: 15px; border-radius: 8px; text-align: center; }
        .dash-card.revenue { background-color: rgba(59, 130, 246, 0.1); border-color: var(--accent-blue); }
        .dash-card span { display: block; font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .dash-card strong { font-size: 24px; }
        .chart-container { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body>
    <div class="header">
        <h1>LOBOS FLEXS</h1>
        <p>Sistema de Cotización y Registro de Ventas</p>
    </div>

    <div class="container">
        <!-- COTIZADOR -->
        <div class="card">
            <h2>⚙️ Nuevo Trabajo</h2>
            <div class="input-group">
                <label for="display">MODELO DEL EQUIPO</label>
                <input type="text" id="display" placeholder="Ej. iPhone 14 o Moto G50" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="precio">COSTO DEL DISPLAY ($)</label>
                <input type="number" id="precio" placeholder="0.00">
            </div>
            <button class="btn-primary" onclick="calcularCotizacion()">Calcular Presupuesto</button>

            <!-- Vista previa -->
            <div id="cotizacion-preview">
                <div class="preview-row"><span>Costo Pieza:</span><span id="prev-costo">$0</span></div>
                <div class="preview-row text-muted"><span>Insumos (Fijo):</span><span id="prev-insumos">$10</span></div>
                <div class="preview-row text-muted"><span>Envío (Fijo):</span><span id="prev-envio">$100</span></div>
                <div class="preview-row"><span>Tu Ganancia Neta:</span><span id="prev-ganancia" class="text-success">$0</span></div>
                <div class="preview-row preview-total"><span>TOTAL A COBRAR:</span><span id="prev-total">$0</span></div>
                <button class="btn-success" onclick="registrarVentaEnBD()">Registrar Venta</button>
            </div>
        </div>

        <!-- REGISTRO DE VENTAS -->
        <div class="card">
            <h2>📊 Historial de Ventas (Nube)</h2>
            <div class="dashboard">
                <div class="dash-card revenue"><span>Ingresos Brutos</span><strong id="dash-ingresos">$0</strong></div>
                <div class="dash-card"><span>Ganancia Neta</span><strong id="dash-ganancia" class="text-success">$0</strong></div>
            </div>
            <div class="table-container">
                <table id="tablaVentas">
                    <thead>
                        <tr>
                            <th>Fecha/Hora</th>
                            <th>Modelo</th>
                            <th class="text-right">Display</th>
                            <th class="text-right">Ganancia</th>
                            <th class="text-right">Cobrado</th>
                        </tr>
                    </thead>
                    <tbody><!-- Las ventas se cargarán aquí --></tbody>
                </table>
            </div>
        </div>

        <!-- GRÁFICA -->
        <div class="card chart-section">
            <h2>📈 Rendimiento por Trabajo</h2>
            <div class="chart-container">
                <canvas id="graficaVentas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ¡TU ENLACE DE RENDER YA ESTÁ AQUÍ INTEGRADO!
        const API_URL = "https://lobos-flexs-system.onrender.com/api/ventas";
        
        let ventaPendiente = null;
        let totalIngresos = 0;
        let totalGanancia = 0;
        let chartInstance = null;
        let etiquetasGrafica = [];
        let datosIngresos = [];
        let datosGanancias = [];

        window.onload = function() {
            inicializarGrafica();
            cargarDatosDesdeBD();
        };

        function inicializarGrafica() {
            const ctx = document.getElementById('graficaVentas').getContext('2d');
            Chart.defaults.color = '#94a3b8';
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: etiquetasGrafica,
                    datasets: [
                        { label: 'Ingreso Total ($)', data: datosIngresos, backgroundColor: 'rgba(59, 130, 246, 0.7)', borderColor: '#3b82f6', borderWidth: 1, borderRadius: 4 },
                        { label: 'Ganancia Neta ($)', data: datosGanancias, backgroundColor: 'rgba(16, 185, 129, 0.7)', borderColor: '#10b981', borderWidth: 1, borderRadius: 4 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: '#334155' } }, x: { grid: { display: false } } } }
            });
        }

        function formatearMoneda(valor) {
            return '$' + parseFloat(valor).toLocaleString('es-MX', {minimumFractionDigits: 0, maximumFractionDigits: 0});
        }

        function calcularCotizacion() {
            const displayInput = document.getElementById('display').value.trim();
            const precio = parseFloat(document.getElementById('precio').value);

            if (!displayInput || isNaN(precio)) {
                alert("Por favor, ingresa el modelo y el costo del display para cotizar.");
                return;
            }

            const insumos = 10;
            const envio = 100;
            let ganancia = 0;
            const modeloLower = displayInput.toLowerCase();
            const esIphone = modeloLower.includes('iphone') || modeloLower.includes('apple');

            if (esIphone) {
                if (precio >= 1000) ganancia = 1500;
                else if (precio >= 500) ganancia = 800;
                else ganancia = 600;
            } else {
                if (precio >= 600) ganancia = 700;
                else if (precio >= 300) ganancia = 500;
                else ganancia = 400;
            }

            const totalFinal = precio + insumos + envio + ganancia;

            ventaPendiente = { modelo: displayInput.toUpperCase(), costo: precio, insumos: insumos, envio: envio, ganancia: ganancia, total: totalFinal };

            document.getElementById('prev-costo').innerText = formatearMoneda(precio);
            document.getElementById('prev-ganancia').innerText = formatearMoneda(ganancia);
            document.getElementById('prev-total').innerText = formatearMoneda(totalFinal);
            document.getElementById('cotizacion-preview').style.display = 'block';
        }

        async function registrarVentaEnBD() {
            if (!ventaPendiente) return;
            const payload = {
                modelo: ventaPendiente.modelo,
                costo: ventaPendiente.costo,
                ganancia: ventaPendiente.ganancia,
                total: ventaPendiente.total
            };

            // Cambiamos el texto del botón mientras guarda
            const btn = document.querySelector('.btn-success');
            btn.innerText = "Guardando...";
            btn.disabled = true;

            try {
                const respuesta = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (respuesta.ok) {
                    const nuevaVenta = await respuesta.json();
                    renderizarFila(nuevaVenta);
                    actualizarDashboardYGrafica(nuevaVenta);
                    chartInstance.update();

                    document.getElementById('display').value = '';
                    document.getElementById('precio').value = '';
                    document.getElementById('cotizacion-preview').style.display = 'none';
                    ventaPendiente = null;
                    document.getElementById('display').focus();
                } else {
                    alert("Error al guardar la venta en la nube.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("No se pudo conectar con el servidor.");
            } finally {
                btn.innerText = "Registrar Venta";
                btn.disabled = false;
            }
        }

        async function cargarDatosDesdeBD() {
            try {
                const respuesta = await fetch(API_URL);
                if (respuesta.ok) {
                    const ventas = await respuesta.json();
                    // Invertimos el arreglo para que el más nuevo salga arriba
                    ventas.reverse().forEach(venta => {
                        renderizarFila(venta);
                        actualizarDashboardYGrafica(venta);
                    });
                    chartInstance.update();
                }
            } catch (error) {
                console.error("Error al cargar historial:", error);
            }
        }

        function renderizarFila(venta) {
            const tbody = document.querySelector('#tablaVentas tbody');
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td>
                    <span class="badge text-muted">${venta.fecha}</span><br>
                    <span class="badge">${venta.hora}</span>
                </td>
                <td><strong>${venta.modelo}</strong></td>
                <td class="text-right">${formatearMoneda(venta.costo)}</td>
                <td class="text-right text-success">${formatearMoneda(venta.ganancia)}</td>
                <td class="text-right"><strong>${formatearMoneda(venta.total)}</strong></td>
            `;
            tbody.insertBefore(fila, tbody.firstChild);
        }

        function actualizarDashboardYGrafica(venta) {
            totalIngresos += venta.total;
            totalGanancia += venta.ganancia;
            document.getElementById('dash-ingresos').innerText = formatearMoneda(totalIngresos);
            document.getElementById('dash-ganancia').innerText = formatearMoneda(totalGanancia);
            etiquetasGrafica.push(`${venta.fecha} - ${venta.modelo}`);
            datosIngresos.push(venta.total);
            datosGanancias.push(venta.ganancia);
        }

        document.getElementById('precio').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') calcularCotizacion();
        });
    </script>
</body>
</html>
